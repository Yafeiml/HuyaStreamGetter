name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: windows-latest
            target: win-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: osx-x64
          - os: macos-latest
            target: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Single-File Executable
        shell: bash
        run: |
          dotnet publish HuyaStreamGetter.csproj -c Release -r ${{ matrix.target }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./out

      - name: Prepare Package Files
        shell: bash
        run: |
          mkdir -p ./package
          cp config.example.json ./out/config.example.json
          cp config.example.json ./out/config.json || true
          cp README.md ./out/README.md
          cp LICENSE ./out/LICENSE

      - name: Archive on Windows (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $target = "${{ matrix.target }}"
          $zipName = "HuyaStreamGetter-$ver-$target.zip"
          Compress-Archive -Path ./out/* -DestinationPath ./package/$zipName

      - name: Archive on Linux/macOS (.tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ver="${{ steps.get_version.outputs.VERSION }}"
          target="${{ matrix.target }}"
          tar -czvf ./package/HuyaStreamGetter-${ver}-${target}.tar.gz -C ./out .

      - name: Upload Package as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ./package/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          pattern: package-*
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: ./release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
