name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          dotnet publish HuyaStreamGetter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./out

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./package | Out-Null
          Copy-Item config.example.json -Destination ./out/config.example.json -Force
          Copy-Item config.example.json -Destination ./out/config.json -Force
          Copy-Item README.md -Destination ./out/README.md -Force
          Copy-Item LICENSE -Destination ./out/LICENSE -Force
          
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $zipPath = "./package/HuyaStreamGetter-$ver-win-x64.zip"
          Compress-Archive -Path ./out/* -DestinationPath $zipPath -Force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: ./package/*
          draft: false
          prerelease: false
          generate_release_notes: true
